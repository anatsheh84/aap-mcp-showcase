---
- name: Install IIS and deploy a status page
  hosts: all
  gather_facts: true
  tasks:
    - name: Install the IIS Web-Server feature with management tools
      ansible.windows.win_feature:
        name: Web-Server
        state: present
        include_sub_features: true
        include_management_tools: true

    - name: Deploy a simple status page
      ansible.windows.win_copy:
        dest: C:\inetpub\wwwroot\index.html
        content: |
          {{ ansible_hostname }}
          Deployed by Ansible Automation Platform
        force: true

    - name: Ensure the W3SVC service is started
      ansible.windows.win_service:
        name: W3SVC
        state: started

    - name: Verify that IIS returns the expected page
      ansible.windows.win_uri:
        url: http://localhost/
        return_content: true
        status_code: 200
        timeout: 30
      register: iis_page
      retries: 5
      delay: 10
      until: iis_page.status == 200

    - name: Assert the page contains the expected content
      ansible.builtin.assert:
        that:
          - "'{{ ansible_hostname }}' in iis_page.content"
          - "'Deployed by Ansible Automation Platform' in iis_page.content"

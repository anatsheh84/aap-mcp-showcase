---
- name: Configure IIS on Windows hosts
  hosts: all
  become: false
  gather_facts: true
  tasks:
    - name: Install IIS with management tools
      ansible.windows.win_feature:
        name: Web-Server
        state: present
        include_management_tools: true

    - name: Deploy status page
      ansible.windows.win_copy:
        dest: C:\inetpub\wwwroot\index.html
        content: "Status: {{ ansible_hostname }}\r\n\r\nDeployed by Ansible Automation Platform"

    - name: Start W3SVC service
      ansible.windows.win_service:
        name: W3SVC
        state: started
      check_mode: false

    - name: Verify IIS responds with HTTP 200
      ansible.windows.win_uri:
        url: http://localhost/
        status_code: 200
      check_mode: false

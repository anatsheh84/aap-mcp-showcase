---
- name: Install IIS and deploy status page
  hosts: all
  gather_facts: true
  connection: winrm
  vars:
    iis_features:
      - Web-Server
      - Web-Mgmt-Tools
  tasks:
    - name: Ensure IIS Web Server feature is present
      ansible.windows.win_feature:
        name: "{{ item }}"
        state: present
        include_sub_features: true
      loop: "{{ iis_features }}"

    - name: Deploy IIS status page
      ansible.windows.win_copy:
        dest: C:\inetpub\wwwroot\index.html
        content: |
          {{ ansible_hostname }} - Deployed by Ansible Automation Platform

    - name: Ensure the World Wide Web Publishing Service is started
      ansible.windows.win_service:
        name: W3SVC
        state: started
      when: not ansible_check_mode

    - name: Verify IIS is serving the status page
      ansible.windows.win_uri:
        url: http://localhost/
        method: GET
        return_content: false
        status_code: 200
      register: iis_check
      when: not ansible_check_mode

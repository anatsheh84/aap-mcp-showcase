---
- name: Install and configure IIS on Windows hosts
  hosts: all
  gather_facts: true
  connection: winrm
  tasks:

    - name: Install IIS Web-Server feature and Management Tools
      ansible.windows.win_feature:
        name:
          - Web-Server
          - Web-Mgmt-Tools
        state: present
        include_management_tools: true

    - name: Deploy status page to IIS root
      ansible.windows.win_copy:
        dest: C:\inetpub\wwwroot\index.html
        content: |
          <html>
          <head><title>Welcome</title></head>
          <body>
          <h1>{{ ansible_hostname }}</h1>
          <p>Deployed by Ansible Automation Platform</p>
          </body>
          </html>
        force: true

    - name: Ensure IIS service W3SVC is started
      ansible.windows.win_service:
        name: W3SVC
        state: started
      when: not ansible_check_mode

    - name: Verify IIS default site returns HTTP 200
      ansible.windows.win_uri:
        url: http://localhost/
        method: GET
        status_code: 200
        return_content: false
      register: iis_check
      when: not ansible_check_mode

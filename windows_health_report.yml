---
# Read-only health report for Windows hosts. Changes nothing.
- name: Windows health report
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect health data
      ansible.windows.win_shell: |
        $os = Get-CimInstance Win32_OperatingSystem
        $c = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
        $stopped = Get-CimInstance Win32_Service -Filter "StartMode='Auto' AND State<>'Running'" |
          Where-Object { $_.Name -notmatch '^(gupdate|edgeupdate|MapsBroker|sppsvc|RemoteRegistry|GoogleUpdater|TrustedInstaller|WbioSrvc)' }
        $hotfix = Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 3
        $reboot = (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') -or
                  (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired')
        [pscustomobject]@{
          os = $os.Caption
          version = $os.Version
          uptime_hours = [math]::Round(((Get-Date) - $os.LastBootUpTime).TotalHours, 1)
          memory_used_percent = [math]::Round((1 - $os.FreePhysicalMemory / $os.TotalVisibleMemorySize) * 100)
          c_disk_used_percent = [math]::Round((1 - $c.FreeSpace / $c.Size) * 100)
          stopped_automatic_services = @($stopped | ForEach-Object { $_.Name })
          last_patches = @($hotfix | ForEach-Object { "$($_.HotFixID) $($_.InstalledOn.ToString('yyyy-MM-dd'))" })
          pending_reboot = $reboot
          iis_installed = [bool](Get-WindowsFeature Web-Server).Installed
        } | ConvertTo-Json -Compress
      register: health
      changed_when: false

    - name: Health report
      ansible.builtin.debug:
        msg: "{{ {'host': inventory_hostname} | combine(health.stdout | from_json) }}"
